<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
<div class="container">
    <aside class="side-panel">
        <div class="search-box">
            <div style="display: flex; gap: 10px;">
                <input type="text" placeholder="Search Pokémon..." id="search">
                <button id="search-btn" type="submit">Search</button>
                <button id="clear-btn" type="button">X</button>
            </div>
            <p id="errorbox" class="hidden"></p>
        </div>
        <div class="side-panel-content">
            <div class="pokemon-list"></div>
        </div>
    </aside>

    <div class="main">
        <div class="img-containers">
            <img src="#" alt="img" class="pokemain-img">
        </div>

        <ul class="nav nav-tabs premium-tabs" id="myTab" role="tablist">
            <li class="nav-item"><button class="nav-link active" id="home-tab" data-bs-toggle="tab" data-bs-target="#home"><i class="bi bi-info-circle"></i> Info</button></li>
            <li class="nav-item"><button class="nav-link" id="stats-tab" data-bs-toggle="tab" data-bs-target="#stats"><i class="bi bi-graph-up"></i> Stats</button></li>
            <li class="nav-item"><button class="nav-link" id="moves-tab" data-bs-toggle="tab" data-bs-target="#moves"><i class="bi bi-lightning-charge"></i> Moves</button></li>
            <li class="nav-item"><button class="nav-link" id="weakness-tab" data-bs-toggle="tab" data-bs-target="#weakness"><i class="bi bi-shield-exclamation"></i> Weakness</button></li>
            <li class="nav-item"><button class="nav-link" id="evolutions-tab" data-bs-toggle="tab" data-bs-target="#evolutions"><i class="bi bi-chevron-double-up"></i> Evolutions</button></li>
            <li class="nav-item"><button class="nav-link" id="forms-tab" data-bs-toggle="tab" data-bs-target="#forms"><i class="bi bi-shuffle"></i> Forms</button></li>
            <li class="nav-item"><button class="nav-link" id="teams-tab" data-bs-toggle="tab" data-bs-target="#teams"><i class="bi bi-people"></i> Teams</button></li>
        </ul>

        <div class="tab-content mt-3" id="myTabContent">
            <div class="tab-pane fade show active evo" id="home"></div>
            <div class="tab-pane fade" id="stats"></div>
            <div class="tab-pane fade" id="moves"></div>
            <div class="tab-pane fade" id="weakness"></div>
            <div class="tab-pane fade" id="forms"></div>
            <div class="tab-pane fade" id="teams">
                <h3 class="mt-3">Team Builder</h3>
                <div class="team-wrapper">
                    <div class="team-box" id="team1">
                        <h4>Team 1</h4>
                        <div class="team-slot-container"></div>
                    </div>
                    <div class="team-box" id="team2">
                        <h4>Team 2</h4>
                        <div class="team-slot-container"></div>
                    </div>
                </div>
                <button class="btn btn-primary mt-3" id="compare-teams-btn">Compare Teams</button>
                <div id="team-comparison-output" class="mt-4"></div>
            </div>
            <div class="tab-pane fade" id="evolutions">
                <ul class="shiny-list">
                    <li><img src="#" alt="img" class="pokemain-img-shiny"></li>
                    <li><p class="shiny-heading">Shiny Form</p></li>
                </ul>
            </div>
        </div>

        <div class="attributes">
            <p class="name"></p>
            <p class="height"></p>
            <p class="weight"></p>
            <p class="types"></p>
        </div>
    </div>
</div>

<script src="script.js"></script>
<script src="compare-pokemon.js"></script>
<script src="Main-Components.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
